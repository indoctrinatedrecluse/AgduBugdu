name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release Assets
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset_prefix: AgduBugdu-${{ github.ref_name }}-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            asset_prefix: AgduBugdu-${{ github.ref_name }}-linux-x64
          - os: macos-latest
            rid: osx-x64
            asset_prefix: AgduBugdu-${{ github.ref_name }}-osx-x64
          - os: macos-latest
            rid: osx-arm64
            asset_prefix: AgduBugdu-${{ github.ref_name }}-osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build, Test and Publish via CI Runner Script
        shell: pwsh
        run: ./tools/ci-build.ps1 -Rid ${{ matrix.rid }} -Configuration Release -RunTests

      # Windows specific: Create Portable ZIP and Inno Setup Installer EXE
      - name: Package Windows Artifacts (.zip and setup .exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          # 1. Create portable .zip in dist/
          $zipName = "${{ matrix.asset_prefix }}-portable.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "Created portable archive: dist/$zipName"

          # 2. Install Inno Setup via Chocolatey
          choco install innosetup -y --no-progress

          # 3. Locate ISCC compiler and build installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          }

          if ($iscc -and (Test-Path $iscc)) {
            Write-Host "Compiling installer with: $iscc"
            & $iscc tools/installer.iss
            # Move compiled setup exe from publish/installer/ into flat dist/ folder
            Get-ChildItem -Path "publish/installer" -Filter "*.exe" | ForEach-Object {
              Move-Item -Path $_.FullName -Destination "dist/" -Force
            }
            Write-Host "Setup exe moved to dist/"
          } else {
            Write-Error "ISCC compiler could not be located after Chocolatey installation."
            exit 1
          }

      # Linux/macOS specific: Create .tar.gz bundle in dist/
      - name: Package Unix Archive (.tar.gz)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cd publish/${{ matrix.rid }}
          tar -czvf "../../dist/${{ matrix.asset_prefix }}.tar.gz" *
          cd ../..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.rid }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          name: AgduBugdu ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
